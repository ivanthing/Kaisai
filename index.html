<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>开塞 Op.20 第 24 首 逐小节示范</title>
<style>
:root{
  --bg:#e9edf1; --card:#f8fafb; --ink:#1d2533; --muted:#5d6878; --line:#d3d9e0;
  --play:#1f6f8b; --play-ink:#fff; --key:#cf433c; --warn:#d88a1f; --tag:#3a6ea5;
  --tint-key:rgba(207,67,60,.14); --tint-warn:rgba(216,138,31,.15); --paper:#fff; --cursor:#1f6f8b;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a22; --card:#1c242f; --ink:#e6ebf1; --muted:#9aa6b5; --line:#2e3947;
  --play:#3b98b8; --key:#e0625b; --warn:#e3a13f; --tag:#5a8fc6; --paper:#f4f5f2;
}}
:root[data-theme="dark"]{--bg:#141a22; --card:#1c242f; --ink:#e6ebf1; --muted:#9aa6b5; --line:#2e3947; --play:#3b98b8; --key:#e0625b; --warn:#e3a13f; --tag:#5a8fc6; --paper:#f4f5f2;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 64px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.02em}
.grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.grp>span.l{font-size:14px;color:var(--muted);margin-right:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;color:var(--ink);font:inherit;font-size:15px;padding:6px 11px;cursor:pointer;font-variant-numeric:tabular-nums}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
label.chk{display:flex;align-items:center;gap:6px;font-size:15px;cursor:pointer;user-select:none}
label.chk input{width:18px;height:18px;accent-color:var(--play)}
.btn{border:0;border-radius:10px;padding:7px 14px;font:inherit;font-size:15px;cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.main{background:var(--play);color:var(--play-ink);border-color:var(--play)}
button:focus-visible,input:focus-visible{outline:3px solid var(--play);outline-offset:2px}
.status{font-size:14px;color:var(--muted);min-width:9em;font-variant-numeric:tabular-nums}
.intro{margin:22px 0 8px;color:var(--muted);font-size:15px;max-width:48em}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--muted);margin:0 0 22px}
.legend i{display:inline-block;width:22px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px}
section.sys{background:var(--card);border-radius:14px;padding:14px 14px 16px;margin:0 0 22px;border:1px solid var(--line)}
.scroller{overflow-x:auto;border-radius:8px}
.score{position:relative;background:var(--paper);min-width:720px;border-radius:8px}
.score img{display:block;width:100%;height:auto}
.zone{position:absolute;top:0;bottom:0;cursor:pointer;mix-blend-mode:multiply;border-radius:4px}
.zone.l2{background:var(--tint-key)} .zone.l1{background:var(--tint-warn)}
.zone.on{box-shadow:inset 0 0 0 3px var(--play)}
.cursor{position:absolute;top:8%;bottom:6%;width:3px;margin-left:-1px;background:var(--cursor);border-radius:2px;opacity:0;pointer-events:none;transition:left .06s linear}
.cursor.on{opacity:.85}
.cols{display:flex;gap:12px;margin-top:12px}
.col{flex:1 1 0;min-width:0;border-left:4px solid #9aa3ad}
.col.l2{border-color:var(--key)} .col.l1{border-color:var(--warn)}
.ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.pb{width:40px;height:40px;border-radius:50%;border:0;background:var(--play);color:var(--play-ink);cursor:pointer;display:grid;place-items:center;flex:none}
.pb svg{width:16px;height:16px}
.pb.playing{background:var(--ink);color:var(--bg)}
.ch b{font-size:17px}
.ch .t{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tg{font-size:12px;color:#fff;background:var(--tag);border-radius:6px;padding:1px 7px}
.tg.k{background:var(--key)}
ul{margin:4px 0 0;padding-left:1.1em} li{margin:2px 0;font-size:15px}
footer{color:var(--muted);font-size:13px;margin-top:28px}

.col{padding:4px 2px 2px 12px}
.gl{list-style:none;margin:8px 0 0;padding:0}
.g{padding:8px 0 8px;border-top:1px dashed var(--line)}
.gh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gp{width:30px;height:30px;border-radius:50%;border:1px solid var(--play);background:transparent;color:var(--play);cursor:pointer;display:grid;place-items:center;flex:none}
.gp svg{width:11px;height:11px}
.gp.playing{background:var(--play);color:var(--play-ink)}
.gn{font-weight:700;font-size:15px;min-width:3.6em}
.nt{font-size:17px;letter-spacing:.02em}
.nt .fl{color:var(--tag);font-weight:700}
.nt .sh{color:var(--key);font-weight:700}
.nt .na{color:var(--warn);font-weight:700}
.nt .sep{color:var(--muted);margin:0 .15em}
.pos{font-size:13px;border:1px solid var(--line);border-radius:6px;padding:0 7px;background:var(--bg);white-space:nowrap}
.pos.shift{border-color:var(--warn)}
.inf{font-size:12px;color:var(--muted)}
.acc{font-size:13px;color:var(--muted);margin:2px 0 0 38px}
.g ul{margin:3px 0 0 38px;padding-left:1em}
.g li{font-size:15px}
.whole{margin-top:6px;padding:8px 10px;border-radius:8px;background:var(--bg);font-size:15px}
.whole b{margin-right:6px}
.whole ul{margin:2px 0 0;padding-left:1.1em}
.gz{position:absolute;top:0;bottom:0;pointer-events:none;border-radius:4px;box-shadow:inset 0 0 0 3px var(--play);opacity:0}
.gz.on{opacity:1}
@media (max-width:700px){.cols{flex-direction:column}.bar{gap:6px 10px;padding:8px 12px}header.top h1{display:none}.seg button{padding:5px 9px;font-size:14px}.mt{display:block}}
.mt{display:none;font-size:22px;margin:18px 0 0}
@media (prefers-reduced-motion:reduce){.cursor{transition:none}}
</style>
</head>

<header class="top"><div class="bar">
  <h1>开塞 Op.20 第 24 首</h1>
  <div class="grp"><span class="l">速度</span><div class="seg" id="tempo"></div></div>
  <div class="grp"><span class="l">一拍</span><div class="seg" id="unit">

    <label class="chk"><input type="checkbox" id="loop">循环</label>
    <label class="chk"><input type="checkbox" id="metro">节拍器</label>
    <label class="chk"><input type="checkbox" id="count" checked>预备拍</label>
  </div>
  <div class="grp"><button class="btn main" id="all">播放全曲</button><button class="btn" id="stop">停止</button><span class="status" id="st" aria-live="polite"></span></div>

<main class="wrap">
<h1 class="mt">开塞 Op.20 第 24 首</h1>
<p class="intro">每小节 16 个音分成 4 块，每块 4 个音。大播放键播放整小节，每块前面的小播放键只播放这一块；也可以直接点谱上的小节。示范音是电脑合成的，用来听音高和节奏；速度按老师的方法默认小拍子 70 拍。</p>
<div class="legend"><span><i style="background:var(--tint-key);outline:2px solid var(--key)"></i>老师点名重点练</span><span><i style="background:var(--tint-warn);outline:2px solid var(--warn)"></i>需要特别注意</span><span><b style="color:var(--key)">升</b> <b style="color:var(--tag)">降</b> <b style="color:var(--warn)">还原</b>：音名颜色</span><span>把位后面写“推断”的，是老师没有明说、按前后小节推断的</span></div>

const SOL={C:'do',D:'re',E:'mi',F:'fa',G:'so',A:'la',B:'si'};
function solf(nm,nat){const L=nm[0],a=nm[1]==='#'?'#':nm[1]==='b'?'b':'';const s=SOL[L];
  if(a==='#')return{t:'升'+s,c:'sh',k:'升',s};if(a==='b')return{t:'降'+s,c:'fl',k:'降',s};if(nat)return{t:'还原'+s,c:'na',k:'还原',s};return{t:s,c:'',k:'',s}}
function esc(x){return x}
DATA.forEach(sys=>{
  const sec=document.createElement('section');sec.className='sys';
  const sc=document.createElement('div');sc.className='scroller';
  const score=document.createElement('div');score.className='score';
  const img=new Image();img.src=sys.img;img.alt='第 '+sys.bars[0].n+'–'+sys.bars[sys.bars.length-1].n+' 小节乐谱';score.appendChild(img);
  const cur=document.createElement('div');cur.className='cursor';
  const cols=document.createElement('div');cols.className='cols';
  sys.bars.forEach(b=>{
    const z=document.createElement('div');z.className='zone l'+b.lvl;z.style.left=(b.a*100)+'%';z.style.width=((b.b-b.a)*100)+'%';
    z.title='播放第 '+b.n+' 小节';z.onclick=()=>toggle(b.n,-1);score.appendChild(z);
    const c=document.createElement('div');c.className='col l'+b.lvl;c.id='bar'+b.n;
    c.style.flexGrow=Math.max(0.3,b.b-b.a).toFixed(3);
    const tags=(b.lvl===2?'<span class="tg k">重点练</span>':'')+b.tags.map(t=>'<span class="tg">'+t+'</span>').join('');
    let h='<div class="ch"><button class="pb" aria-label="播放第 '+b.n+' 小节">'+PLAY+'</button><b>第 '+b.n+' 小节</b><span class="t">视频 '+b.t+'</span>'+tags+'</div><ol class="gl">';
    b.groups.forEach((g,gi)=>{
      const evs=b.ev.slice(g.a,g.b);const acc={升:new Set(),降:new Set(),还原:new Set()};
      const nt=evs.map(e=>e.nm.map((nm,k)=>{const s=solf(nm,e.nat[k]);if(s.k)acc[s.k].add(s.s);return '<span class="'+s.c+'">'+s.t+'</span>'}).join('<span class="sep">+</span>')).join(' ');
      const accTxt=['升','降','还原'].filter(k=>acc[k].size).map(k=>k+' '+[...acc[k]].join('、')).join('；')||'没有升降';
      const shift=g.pos.includes('→');
      h+='<li class="g"><div class="gh"><button class="gp" data-g="'+gi+'" aria-label="播放第 '+b.n+' 小节 '+g.lab+'">'+PLAY+'</button><span class="gn">'+g.lab+'</span><span class="nt">'+nt+'</span><span class="pos'+(shift?' shift':'')+'">'+g.pos+'</span>'+(g.inf?'<span class="inf">推断</span>':'')+'</div>'
        +'<div class="acc">'+accTxt+'</div><ul>'+g.pts.map(p=>'<li>'+p+'</li>').join('')+'</ul></li>';
    });
    h+='</ol><div class="whole"><b>整小节</b>'+(b.whole.length>1?'<ul>'+b.whole.map(p=>'<li>'+p+'</li>').join('')+'</ul>':b.whole[0])+'</div>';
    c.innerHTML=h;
    const pb=c.querySelector('.pb');pb.onclick=()=>toggle(b.n,-1);
    const rh=rhythm(b.n,b.ev.length);
    const gz=b.groups.map((g,gi)=>{const e=document.createElement('div');e.className='gz';
      const x0=Math.max(b.a,b.ev[g.a].f-0.014),x1=g.b<b.ev.length?b.ev[g.b].f-0.014:b.b-0.004;
      e.style.left=(x0*100)+'%';e.style.width=((x1-x0)*100)+'%';score.appendChild(e);return e});
    const gbtn=[...c.querySelectorAll('.gp')];gbtn.forEach(x=>x.onclick=()=>toggle(b.n,+x.dataset.g));
    cols.appendChild(c);
    BARS[b.n]={...b,zone:z,btn:pb,cursor:cur,rh,gz,gbtn};
  });
  score.appendChild(cur);sc.appendChild(score);sec.appendChild(sc);sec.appendChild(cols);list.appendChild(sec);
});
// ---------- audio ----------
let ctx,master,session=null;
function ac(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();}if(ctx.state==='suspended')ctx.resume();return ctx}
const hz=m=>440*Math.pow(2,(m-69)/12);
function voice(out,m,t,dur,vel){
  const f=hz(m),g=ctx.createGain(),lp=ctx.createBiquadFilter(),pk=ctx.createBiquadFilter();
  lp.type='lowpass';lp.frequency.value=Math.min(4200,f*7);lp.Q.value=0.7;
  pk.type='peaking';pk.frequency.value=2800;pk.gain.value=5;pk.Q.value=1.2;
  const o1=ctx.createOscillator(),o2=ctx.createOscillator();o1.type=o2.type='sawtooth';
  o1.frequency.value=f;o2.frequency.value=f;o2.detune.value=6;
  if(dur>0.35){const lfo=ctx.createOscillator(),ld=ctx.createGain();lfo.frequency.value=5.6;ld.gain.setValueAtTime(0,t);ld.gain.linearRampToValueAtTime(f*0.004,t+0.25);lfo.connect(ld);ld.connect(o1.frequency);ld.connect(o2.frequency);lfo.start(t);lfo.stop(t+dur+0.1)}
  o1.connect(lp);o2.connect(lp);lp.connect(pk);pk.connect(g);g.connect(out);
  const a=Math.min(0.03,dur*0.25),r=Math.min(0.06,dur*0.3);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vel,t+a);g.gain.setValueAtTime(vel*0.85,t+Math.max(a,dur-r));g.gain.linearRampToValueAtTime(0,t+dur+0.01);
  o1.start(t);o2.start(t);o1.stop(t+dur+0.05);o2.stop(t+dur+0.05);
}
function click(out,t,acc){const o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.value=acc?1760:1100;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(acc?0.22:0.12,t+0.002);g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);o.connect(g);g.connect(out);o.start(t);o.stop(t+0.06)}
const sixteenth=()=>60/tempo/unit;
function clearUI(){
  document.querySelectorAll('.zone.on,.gz.on,.cursor.on').forEach(z=>z.classList.remove('on'));
  document.querySelectorAll('.pb.playing,.gp.playing').forEach(b=>{b.classList.remove('playing');b.innerHTML=PLAY});
}
function stop(){
  if(!session)return;
  const s=session;session=null;cancelAnimationFrame(s.raf);clearInterval(s.timer);
  s.out.gain.cancelScheduledValues(ctx.currentTime);s.out.gain.setTargetAtTime(0,ctx.currentTime,0.02);setTimeout(()=>s.out.disconnect(),300);
  clearUI();document.getElementById('st').textContent='';
}
function seg(n,g){const b=BARS[n];if(g<0)return{n,g,a:0,b:b.ev.length};const x=b.groups[g];return{n,g,a:x.a,b:x.b}}
function toggle(n,g){const was=session&&session.key===n+':'+g;stop();if(!was)play([seg(n,g)],n+':'+g,false)}
function play(seq,key,all){
  ac();const out=ctx.createGain();out.gain.value=0.9;out.connect(ctx.destination);
  const s={seq,key,all,out,idx:0,loop:document.getElementById('loop').checked,metro:document.getElementById('metro').checked,visual:[]};
  session=s;
  const u=sixteenth();
  let t=ctx.currentTime+0.12;
  if(document.getElementById('count').checked){for(let i=0;i<4;i++)click(out,t+i*unit*u,i===0);t+=4*unit*u;}
  s.next=t;
  const schedule=()=>{
    while(s===session&&s.next<ctx.currentTime+0.6){
      if(s.idx>=s.seq.length){if(s.loop)s.idx=0;else{s.endAt=s.next;break}}
      const sg=s.seq[s.idx++],b=BARS[sg.n],t0=s.next,o0=b.rh[sg.a].o;
      const len=(sg.b<b.rh.length?b.rh[sg.b].o:16)-o0;
      s.visual.push({t:t0,sg});
      for(let i=sg.a;i<sg.b;i++){const r=b.rh[i],ev=b.ev[i],d=r.s*u*0.95,tt=t0+(r.o-o0)*u;
        ev.m.forEach((m,k)=>voice(out,m,tt+k*0.035,Math.max(0.05,d-k*0.035),0.16/Math.sqrt(ev.m.length)));s.visual.push({t:tt,n:sg.n,f:ev.f})}
      if(s.metro)for(let k=0;k<len;k+=unit)click(out,t0+k*u,k===0);
      s.next=t0+len*u;
    }
    if(s.endAt&&ctx.currentTime>s.endAt+0.1)stop();
  };
  schedule();s.timer=setInterval(schedule,100);
  const draw=()=>{
    if(s!==session)return;
    const now=ctx.currentTime;
    while(s.visual.length&&s.visual[0].t<=now){
      const v=s.visual.shift();
      if(v.sg){
        const sg=v.sg,b=BARS[sg.n];clearUI();
        if(sg.g<0){b.zone.classList.add('on');b.btn.classList.add('playing');b.btn.innerHTML=STOP}
        else{b.gz[sg.g].classList.add('on');b.gbtn[sg.g].classList.add('playing');b.gbtn[sg.g].innerHTML=STOP}
        document.getElementById('st').textContent='正在播放第 '+sg.n+' 小节'+(sg.g<0?'':' '+b.groups[sg.g].lab);
        if(s.all){const r=b.zone.getBoundingClientRect();if(r.top<120||r.bottom>innerHeight)b.zone.closest('section').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}
      }else{const b=BARS[v.n];b.cursor.style.left=(v.f*100)+'%';b.cursor.classList.add('on')}
    }
    s.raf=requestAnimationFrame(draw);
  };
  s.raf=requestAnimationFrame(draw);
}
document.getElementById('all').onclick=()=>{stop();play(Array.from({length:37},(_,i)=>seg(i+1,-1)),'all',true)};
document.getElementById('stop').onclick=stop;
</script>
